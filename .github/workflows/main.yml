name: Build CHISHTI BRO Windows EXE
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build Windows launcher
        run: pyinstaller --noconfirm --clean --onefile --windowed --name CHISHTI_BRO_PAKISTAN_OPEN_WORLD --add-data "game;game" launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: CHISHTI-BRO-Windows-EXE
          path: dist/CHISHTI_BRO_PAKISTAN_OPEN_WORLD.exe
          if-no-files-found: error
